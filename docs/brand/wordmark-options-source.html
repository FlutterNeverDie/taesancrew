<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Big+Shoulders+Stencil+Display:wght@900&family=Unbounded:wght@800&family=Saira:ital,wdth,wght@1,125,800&family=Bricolage+Grotesque:opsz,wdth,wght@96,75,800&family=Syne:wght@800&family=Michroma&family=Russo+One&family=Kanit:ital,wght@1,900&family=Lexend+Zetta:wght@800&family=Teko:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<script>
// 글꼴별 설정: [family, weight, style, stretch, 자간(em)]
const F = {
  A: ['Archivo', 900, 'normal', 'expanded', -0.01],
  B: ['Big Shoulders Stencil Display', 900, 'normal', 'normal', 0.02],
  C: ['Unbounded', 800, 'normal', 'normal', -0.02],
  D: ['Saira', 800, 'italic', 'expanded', -0.01],
  E: ['Bricolage Grotesque', 800, 'normal', 'condensed', -0.02],
  F: ['Syne', 800, 'normal', 'normal', -0.02],
  G: ['Michroma', 400, 'normal', 'normal', -0.02],
  H: ['Russo One', 400, 'normal', 'normal', 0],
  I: ['Kanit', 900, 'italic', 'normal', -0.01],
  J: ['Lexend Zetta', 800, 'normal', 'normal', -0.06],
  K: ['Teko', 700, 'normal', 'normal', 0.01],
};
const key = new URLSearchParams(location.search).get('f');
const [fam, wt, st, str, ls] = F[key];
const W = 1720, H = 420, TEXT = 'TS CREW';
const c = document.createElement('canvas'); c.width = W; c.height = H; document.body.appendChild(c);
const g = c.getContext('2d');
const setFont = (size) => { g.font = `${st} ${wt} ${size}px "${fam}"`; g.fontStretch = str; g.letterSpacing = (ls * size) + 'px'; };
const ink = (size) => { setFont(size); const m = g.measureText(TEXT); return { w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight, h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent, l: m.actualBoundingBoxLeft, a: m.actualBoundingBoxAscent }; };
document.fonts.load(`${st} ${wt} 100px "${fam}"`).then(() => document.fonts.ready).then(() => {
  const b = ink(200);
  const size = 200 * Math.min(1480 / b.w, 230 / b.h);
  const m = ink(size);
  g.fillStyle = '#22215a';
  g.fillText(TEXT, (W - m.w) / 2 + m.l, (H - m.h) / 2 + m.a);
});
</script></body></html>
