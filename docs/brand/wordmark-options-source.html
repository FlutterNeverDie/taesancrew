<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Russo+One&family=Kanit:ital,wght@1,900&family=Lexend+Zetta:wght@800&family=Teko:wght@700&display=block" rel="stylesheet">
<style>
html, body { margin: 0; background: transparent; }
body { width: 1720px; height: 420px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.t { line-height: 1; color: #22215a; white-space: nowrap; font-size: 200px; visibility: hidden; }
.G { font-family: Michroma; letter-spacing: -0.02em; }
.H { font-family: "Russo One"; letter-spacing: 0; }
.I { font-family: Kanit; font-weight: 900; font-style: italic; letter-spacing: -0.01em; }
.J { font-family: "Lexend Zetta"; font-weight: 800; letter-spacing: -0.06em; }
.K { font-family: Teko; font-weight: 700; letter-spacing: 0.01em; }
</style></head><body>
<script>
const f = new URLSearchParams(location.search).get('f');
document.body.innerHTML = '<div class="t ' + f + '">TS CREW</div>';
const t = document.querySelector('.t');
document.fonts.ready.then(() => {
  // 실제 잉크(글자 모양) 크기를 재서 폭 1480 / 높이 230 안에 맞추고 정확히 가운데로
  const cs = getComputedStyle(t);
  const ctx = document.createElement('canvas').getContext('2d');
  const measure = (size) => {
    ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + size + 'px ' + cs.fontFamily;
    ctx.letterSpacing = ((parseFloat(cs.letterSpacing) || 0) / 200 * size) + 'px';
    const m = ctx.measureText('TS CREW');
    return { w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight, h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent, left: m.actualBoundingBoxLeft, asc: m.actualBoundingBoxAscent };
  };
  const base = measure(200);
  const size = 200 * Math.min(1480 / base.w, 230 / base.h);
  const m = measure(size);
  document.body.innerHTML = '';
  const c = document.createElement('canvas');
  c.width = 1720; c.height = 420; document.body.appendChild(c);
  const g = c.getContext('2d');
  g.font = ctx.font; g.letterSpacing = ctx.letterSpacing; g.fillStyle = '#22215a';
  g.fillText('TS CREW', (1720 - m.w) / 2 + m.left, (420 - m.h) / 2 + m.asc);
});
</script></body></html>
