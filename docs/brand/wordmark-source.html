<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: P; font-weight: 900; src: url(fonts/Paperlogy-9Black.woff2); }
:root { --navy: #22215a; --yellow: #ffd23f; }
html, body { margin: 0; background: transparent; }
body { display: flex; align-items: center; justify-content: center; font-family: P; font-weight: 900; overflow: hidden; }
.wide { width: 1720px; height: 420px; }
.wide .t { font-size: 300px; line-height: 1; letter-spacing: 0.005em; color: var(--navy); white-space: nowrap; transform: translateY(0.04em); }
.wide.white .t { color: #fff; }
/* 앱 아이콘: 정사각형 꽉 채움 (iOS가 모서리를 알아서 둥글게 깎음) */
.app { width: 180px; height: 180px; background: var(--navy); flex-direction: column; gap: 0; }
.app .l1, .app .l2 { color: #fff; line-height: 0.8; }
.app .l1 { font-size: 92px; letter-spacing: 0.01em; }
.app .l2 { font-size: 44px; letter-spacing: 0.02em; margin-top: 9px; }
</style></head>
<body>
<script>
const v = new URLSearchParams(location.search).get('v');
const b = document.body;
if (v === 'app') { b.className = 'app'; b.innerHTML = '<div class="l1">TS</div><div class="l2">CREW</div>'; }
else { b.className = 'wide' + (v === 'white' ? ' white' : ''); b.innerHTML = '<div class="t">TS CREW</div>'; }
</script>
</body></html>
